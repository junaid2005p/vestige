name: CI

on: [push, pull_request]

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - run: gofmt -l .
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...
      - run: go test -coverprofile coverage.out ./...
      - run: go tool cover -func coverage.out
      - run: go test -run=^$ -fuzz=Fuzz -fuzztime=10s ./internal/chunker
      - run: go test -run=^$ -fuzz=Fuzz -fuzztime=10s ./internal/repository
      - run: go build ./cmd/vestige
